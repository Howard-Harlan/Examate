plugins {
    alias(libs.plugins.androidApplication)
    alias(libs.plugins.kotlinAndroid)
    alias(libs.plugins.composeCompiler)
}

android {
    namespace 'go.examate.hyp'
    compileSdk 36

    // 从 local.properties 读取签名信息,避免明文入库
    def props = new Properties()
    def propFile = rootProject.file('local.properties')
    if (propFile.exists()) {
        props.load(new FileInputStream(propFile))
    }

    experimentalProperties["android.experimental.enableArtProfiles"] = false

    signingConfigs {
        release {
            // keystore 文件统一放在 app/ 模块下,显式用 rootProject.file 避免歧义
            storeFile rootProject.file("app/${props.getProperty('keystore.file', 'examate-release.jks')}")
            storePassword props.getProperty('keystore.password', '')
            keyAlias props.getProperty('keystore.alias', '')
            keyPassword props.getProperty('keystore.keyPassword', '')
        }
    }

    defaultConfig {
        applicationId "go.examate.hyp"
        minSdk 31
        targetSdk 36
        versionCode 8
        versionName "1.3"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // 限定 QuickJS 等原生库 ABI:仅 arm64-v8a(当前设备主流,控制体积;老 armv7 机占比极低)
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        aidl true
        compose true
        buildConfig true
    }
    packaging {
        resources {
            excludes += [
                'META-INF/versions/9/OSGI-INF/MANIFEST.MF',
                'META-INF/INDEX.LIST',
                'META-INF/io.netty.versions.properties'
            ]
        }
    }
}

dependencies {

    // Shizuku API
    implementation libs.shizuku.api
    implementation libs.shizuku.provider

    implementation libs.appcompat
    implementation libs.material
    implementation libs.constraintlayout

    // androidx.webkit: WebViewCompat.addDocumentStartJavaScript 等官方 WebView 增强能力
    implementation libs.webkit

    // backdrop 液态玻璃库(实验性,仅安卓 13+ 启用)
    implementation libs.backdrop
    implementation libs.shapes

    // OkHttp: 校园 API 客户端(淮北师范大学 CAS/教务/一卡通/第二课堂)
    implementation libs.okhttp

    // jsoup: legado 书源 HTML 解析(class./id./tag. 选择器)
    implementation libs.jsoup

    // QuickJS: 执行 legado 书源内嵌 JS(@js/<js>),沙箱内只注入受控 java.* 方法
    implementation libs.quickjs.wrapper

    // ViewModel for Compose
    implementation libs.lifecycle.viewmodel.compose
    implementation libs.lifecycle.runtime.compose

    // Compose
    implementation platform(libs.compose.bom)
    implementation libs.activity.compose
    implementation libs.compose.ui
    implementation libs.compose.ui.graphics
    implementation libs.compose.ui.tooling.preview
    implementation libs.compose.material3
    implementation libs.compose.material.icons.core
    implementation libs.compose.material.icons.extended
    implementation libs.compose.foundation
    debugImplementation libs.compose.ui.tooling

    // Coil: 图片加载(淮师心声等)
    implementation libs.coil.compose

    // Palette: 封面主色提取(播放页动态主题)
    implementation libs.palette.ktx

    // MediaSessionCompat / MediaStyle: 音乐后台播放通知栏控制
    implementation libs.media

    // 支付宝 SDK(水卡充值拉起支付宝 App/H5 网页支付)
    // POM 中传递依赖 group/artifact 为空(已知 bug),需关闭传递依赖
    implementation(libs.alipay.sdk) {
        transitive = false
    }

    // 微信 SDK(水卡充值拉起微信支付)
    implementation libs.wechat.sdk

    // BouncyCastle(Nostr secp256k1 Schnorr 签名)
    implementation libs.bouncycastle

    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
}
