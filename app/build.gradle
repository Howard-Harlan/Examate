plugins {
    alias(libs.plugins.androidApplication)
    alias(libs.plugins.kotlinAndroid)
    alias(libs.plugins.composeCompiler)
}

android {
    namespace 'go.examate.hyp'
    compileSdk 36

    // 从 local.properties 读取签名信息,避免明文入库
    def props = new Properties()
    def propFile = rootProject.file('local.properties')
    if (propFile.exists()) {
        props.load(new FileInputStream(propFile))
    }

    signingConfigs {
        release {
            storeFile file(props.getProperty('keystore.file', 'examate-release.jks'))
            storePassword props.getProperty('keystore.password', '')
            keyAlias props.getProperty('keystore.alias', '')
            keyPassword props.getProperty('keystore.keyPassword', '')
        }
    }

    defaultConfig {
        applicationId "go.examate.hyp"
        minSdk 31
        targetSdk 35
        versionCode 6
        versionName "1.1"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        aidl true
        compose true
        buildConfig true
    }
}

dependencies {

    // Shizuku API
    implementation libs.shizuku.api
    implementation libs.shizuku.provider

    implementation libs.appcompat
    implementation libs.material
    implementation libs.constraintlayout

    // backdrop 液态玻璃库(实验性,仅安卓 13+ 启用)
    implementation libs.backdrop
    implementation libs.shapes

    // OkHttp: 校园 API 客户端(淮北师范大学 CAS/教务/一卡通/第二课堂)
    implementation libs.okhttp

    // ViewModel for Compose
    implementation libs.lifecycle.viewmodel.compose
    implementation libs.lifecycle.runtime.compose

    // Compose
    implementation platform(libs.compose.bom)
    implementation libs.activity.compose
    implementation libs.compose.ui
    implementation libs.compose.ui.graphics
    implementation libs.compose.ui.tooling.preview
    implementation libs.compose.material3
    implementation libs.compose.material.icons.core
    implementation libs.compose.foundation
    debugImplementation libs.compose.ui.tooling

    // Coil: 图片加载(淮师心声等)
    implementation libs.coil.compose

    // 支付宝 SDK(水卡充值拉起支付宝 App/H5 网页支付)
    // POM 中传递依赖 group/artifact 为空(已知 bug),需关闭传递依赖
    implementation(libs.alipay.sdk) {
        transitive = false
    }

    // 微信 SDK(水卡充值拉起微信支付)
    implementation libs.wechat.sdk

    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
}
